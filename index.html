
<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05070a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="ZapiTV" />
    <meta name="apple-mobile-web-app-title" content="ZapiTV" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://m.media-amazon.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.metahub.space" />
    <link rel="dns-prefetch" href="https://v3-cinemeta.strem.io" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@700&display=swap" rel="stylesheet">
    <style>
      /* Fundo estrutural opaco permanente (html, body, #root) - previne piscada branca no DWM/Windows */
      html, body, #root {
        background-color: #05070a;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }

      html.light,
      html.light body,
      html.light #root,
      body.light,
      body.light #root {
        background-color: #F8F9FC;
      }

      body {
        font-family: 'Inter', sans-serif;
        /* Remove scrollbar and prevent horizontal overflow */
        overflow-x: hidden;
      }

      /* Ocultar barra de rolagem em todos os elementos */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      *::-webkit-scrollbar {
        display: none; /* Chrome, Safari and Opera */
      }

      /* Utility to hide scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var pathname = window.location.pathname || '';
          var hasTv = search.indexOf('tv=1') !== -1 || search.indexOf('tv=true') !== -1;
          if (hasTv && pathname !== '/tv' && !pathname.startsWith('/tv')) {
            var isDiag = search.indexOf('tvdiag=1') !== -1 || search.indexOf('tv_diag=1') !== -1;
            window.location.replace('/tv' + (isDiag ? '?tvdiag=1' : ''));
          }
        } catch (e) {}
      })();
    </script>
</head>
  <body class="dark text-white overflow-x-hidden no-scrollbar" style="background-color: #05070a;">
    <div id="root" style="background-color: #05070a; min-height: 100vh;"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          reg.update().catch(() => {});
        }).catch(err => {
          console.warn('Falha no registro do ServiceWorker:', err);
        });
      });
    }
  </script>
</body>
</html>
