name: Atualização Agendada Em Destaque (Rankings Mensais & Semanais)

on:
  schedule:
    # Toda segunda-feira às 06:00 BRT (09:00 UTC)
    - cron: '0 9 * * 1'
    # No 1º dia de cada mês às 06:00 BRT (09:00 UTC) para consolidação do novo mês
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  update-featured-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar Endpoint de Atualização dos Rankings (Mensal + Semanal)
        env:
          APP_URL: ${{ secrets.ZAPITV_URL || 'https://zapitv-stream.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Aviso: CRON_SECRET não configurado. Tentando acionamento com token padrão..."
          fi
          echo "Disparando atualização dos rankings Em Destaque (Filmes, Séries e Animes)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${APP_URL}/api/featured/cron" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "Status HTTP: $HTTP_STATUS"
          echo "Resposta: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Rankings mensais e semanais atualizados e persistidos com sucesso!"
            exit 0
          else
            echo "Falha ao acionar cron de rankings: Status $HTTP_STATUS"
            exit 1
          fi
