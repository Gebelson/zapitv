name: Atualização Semanal Em Destaque (IMDb)

on:
  schedule:
    # Executa toda segunda-feira às 06:00 BRT (09:00 UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-featured-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar Endpoint de Atualização Semanal
        env:
          APP_URL: ${{ secrets.ZAPITV_URL || 'https://zapitv-stream.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Disparando atualização semanal dos rankings Em Destaque..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${APP_URL}/api/featured/cron" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-cron: 1")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "Status HTTP: $HTTP_STATUS"
          echo "Resposta: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Rankings semanais atualizados com sucesso!"
            exit 0
          else
            echo "Falha ao acionar cron semanal: Status $HTTP_STATUS"
            exit 1
          fi
