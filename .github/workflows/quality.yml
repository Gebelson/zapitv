name: Qualidade do ZapiTV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Synthetic public Web App settings for CI; not a provisioned remote Firebase project.
# Browser tests must never initialize the Production Firebase application.
env:
  ZAPITV_DEPLOYMENT_ENV: preview
  ZAPITV_PREVIEW_FIREBASE_PROJECT_ID: zapitv-staging-fixture
  ZAPITV_PREVIEW_FIREBASE_API_KEY: AIzasssssssssssssssssssssssssssssssssss
  ZAPITV_PREVIEW_FIREBASE_APP_ID: 1:222222222:web:abcdef0123456789
  ZAPITV_PREVIEW_FIREBASE_AUTH_DOMAIN: zapitv-staging-fixture.firebaseapp.com
  ZAPITV_PREVIEW_FIREBASE_DATABASE_ID: (default)
  ZAPITV_PREVIEW_FIREBASE_STORAGE_BUCKET: zapitv-staging-fixture.firebasestorage.app
  ZAPITV_PREVIEW_FIREBASE_MESSAGING_SENDER_ID: '222222222'

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:architecture
      - run: npm run test:architecture
      - run: npm run test:catalog-sort
      - run: npm run test:firebase-preview-bundle
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tv-focus-browser
      - run: npm run test:session-stability
      - run: npm run test:player-real
      - run: npm run test:storage-browser
      - run: npm run test:p1-browser
      - run: npm run test:outbox-browser
      - run: npm run test:catalog-longevity
      - run: npm run test:mobile-ranked-stability
      - run: npm run test:continuity-browser
      - run: npm run test:six-flows-browser
      - run: npm run test:tv-search-b-disambiguation
  search-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:search-performance
